<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23cba6f7'/><rect x='11' y='7' width='10' height='18' rx='3' fill='%231e1e2e'/></svg>" />
    <title>ADB File Manager</title>
    <!-- 首帧前定好口味和主色，避免样式表/脚本加载前闪一下默认配色；键名与 src/theme.ts 一致 -->
    <script>
      (function () {
        var d = document.documentElement;
        var flavors = ["latte", "frappe", "macchiato", "mocha"];
        var accents = ["mauve", "peach", "green", "blue", "rosewater"];
        var f, a;
        try {
          f = JSON.parse(localStorage.getItem("afm.flavor"));
          a = JSON.parse(localStorage.getItem("afm.accent"));
        } catch (e) {}
        if (flavors.indexOf(f) < 0) f = matchMedia("(prefers-color-scheme: light)").matches ? "latte" : "mocha";
        if (accents.indexOf(a) < 0) a = "mauve";
        d.setAttribute("data-flavor", f);
        d.setAttribute("data-accent", a);
      })();
    </script>
    <!-- 各口味的 Crust，CSS 加载后由 index.css 接管 -->
    <style>
      html { background: #11111b; color-scheme: dark; }
      html[data-flavor="latte"] { background: #dce0e8; color-scheme: light; }
      html[data-flavor="frappe"] { background: #232634; }
      html[data-flavor="macchiato"] { background: #181926; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
